# Push a tag like v1.2.0 to build dusage.exe and publish it as a GitHub release.
# install.ps1 always installs the latest release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/Dusage/Dusage.csproj -c Release -o dist -p:Version=$version
          New-Item -ItemType Directory release -Force | Out-Null
          Compress-Archive dist/dusage.exe release/dusage.zip -CompressionLevel Optimal
          $hash = (Get-FileHash release/dusage.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content release/dusage.zip.sha256 "$hash  dusage.zip" -NoNewline

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create '${{ github.ref_name }}' release/dusage.zip release/dusage.zip.sha256
          --title 'dUsage/dt ${{ github.ref_name }}'
          --generate-notes
